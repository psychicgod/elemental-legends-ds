name: Build Elemental Legends DS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest
    steps:
      - name: Download game source
        uses: actions/checkout@v4

      - name: Check installed DS libraries
        run: |
          echo "Checking installed devkitPro files..."
          find /opt/devkitpro -name fat.h -print
          find /opt/devkitpro -name nds.h -print
          find /opt/devkitpro -name ds_rules -print


      - name: Compile ROM

        env:
          DEVKITPRO: /opt/devkitpro
          DEVKITARM: /opt/devkitpro/devkitARM
        run: |
          chmod +x build.sh
          ./build.sh
          test -s elemental_legends.nds

      - name: Upload ROM
        uses: actions/upload-artifact@v4
        with:
          name: Elemental-Legends-DS-ROM
          path: elemental_legends.nds
          if-no-files-found: error
